[project]
name = "mitooni-backend"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi==0.133.0",
    "httpx==0.28.1",
    "openai==2.21.0",
    "openai-agents==0.9.3",
    "psycopg[binary]==3.2.13",
    "supabase==2.28.0",
    "uvicorn==0.36.1",
]

[dependency-groups]
dev = ["pytest==9.0.3"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
